.show{opacity:1;transform:none}
.info{font-size:clamp(24px,6vw,34px);letter-spacing:.08em;font-weight:500;color:#f0d28f}

(function(){

function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}

// afinamento (Zhang-Suen): reduz as letras a um traço central de 1 pixel
function thin(img,w,h){
  var ch=true;
  while(ch){ch=false;
    for(var st=0;st<2;st++){var del=[];
      for(var y=1;y<h-1;y++)for(var x=1;x<w-1;x++){var i=y*w+x;if(!img[i])continue;
        var p2=img[i-w],p3=img[i-w+1],p4=img[i+1],p5=img[i+w+1],p6=img[i+w],p7=img[i+w-1],p8=img[i-1],p9=img[i-w-1];
        var B=p2+p3+p4+p5+p6+p7+p8+p9;if(B<2||B>6)continue;
        var A=(!p2&&p3)+(!p3&&p4)+(!p4&&p5)+(!p5&&p6)+(!p6&&p7)+(!p7&&p8)+(!p8&&p9)+(!p9&&p2);if(A!==1)continue;

        del.push(i);}
      for(var k=0;k<del.length;k++)img[del[k]]=0;if(del.length)ch=true;}
  }
}

function buildLine(text,maxSize,availW,dpr,dur){

    var gr=g.createLinearGradient(0,pad,0,chh);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.fillText(text,x0,y0);return cv;}

    var qh=0,qt=0,dist={},md=0;q[qt++]=s0;seen[s0]=1;dist[s0]=0;
    while(qh<qt){var c=q[qh++],dc=dist[c];xs.push((c%sw)/K);ys.push(Math.floor(c/sw)/K);ts.push(off+dc);if(dc>md)md=dc;
      for(var n=0;n<8;n++){var nn=c+nb[n];if(nn<0||nn>=img.length||!img[nn]||seen[nn])continue;
        var cx=c%sw,nx=nn%sw;if(Math.abs(cx-nx)>1)continue;seen[nn]=1;dist[nn]=dc+1;q[qt++]=nn;}}
    off+=md+6;}
  var N=xs.length,ord=new Array(N);for(i=0;i<N;i++)ord[i]=i;ord.sort(function(a,b){return ts[a]-ts[b];});
  var f=dur/Math.max(off,1);for(i=0;i<N;i++)ts[i]*=f;
  var wrap=document.createElement('div');wrap.className='ln';wrap.style.width=cw+'px';wrap.style.height=chh+'px';
  var v=mk(W,H),gl=mk(W,H);v.className='v';gl.className='g';wrap.appendChild(v);wrap.appendChild(gl);box.appendChild(wrap);
  return {v:v,gl:gl,vc:v.getContext('2d'),gc:gl.getContext('2d'),base:base,bright:bright,mask:mk(W,H),mask2:mk(W,H),
    xs:xs,ys:ys,ts:ts,ord:ord,N:N,r:size*dpr*.062,dur:dur,W:W,H:H,p:0,lo:0};
}

function build(){
  var dpr=Math.min(window.devicePixelRatio||1,2),aw=Math.min(window.innerWidth,820)-48;
  box.textContent='';lines=TEXTS.map(function(t){return buildLine(t[0],t[1],aw,dpr,1500+t[0].length*95);});
  builtW=window.innerWidth;
}
function dots(ctx,l,a,b){ctx.beginPath();for(var i=a;i<b;i++){var k=l.ord[i],x=l.xs[k],y=l.ys[k];ctx.moveTo(x+l.r,y);ctx.arc(x,y,l.r,0,6.2832);}ctx.fill();}
function compose(dst,l,src,mask){dst.globalCompositeOperation='source-over';dst.clearRect(0,0,l.W,l.H);dst.drawImage(src,0,0);
  dst.globalCompositeOperation='destination-in';dst.drawImage(mask,0,0);dst.globalCompositeOperation='source-over';}
function reset(){
  lines.forEach(function(l){l.p=0;l.lo=0;l.vc.clearRect(0,0,l.W,l.H);l.gc.clearRect(0,0,l.W,l.H);
    var a=l.mask.getContext('2d');a.clearRect(0,0,l.W,l.H);a.fillStyle='#000';});
  fp.style.transition='none';fp.style.strokeDashoffset=L;
  [d1,d2,d3,h,fb,fa].forEach(function(e){e.classList.remove('show');});
}
function later(ms,id,fn){setTimeout(function(){if(id===run)fn();},ms);}

function play(){
  if(Math.abs(window.innerWidth-builtW)>40||!lines.length)build();
  var id=++run;reset();
  var t=700,GAP=450;lines.forEach(function(l){l.start=t;t+=l.dur+GAP;});
  var total=t-GAP+250,t0=null;
  function frame(now){
    if(id!==run)return;
    if(t0===null)t0=now;var el=now-t0;
    lines.forEach(function(l){
      var lt=el-l.start;if(lt<0)return;
      var mc=l.mask.getContext('2d');mc.fillStyle='#000';
      var a=l.p;while(l.p<l.N&&l.ts[l.ord[l.p]]<=lt)l.p++;
      if(l.p>a){dots(mc,l,a,l.p);compose(l.vc,l,l.base,l.mask);}
      if(lt<l.dur+400){
        while(l.lo<l.p&&l.ts[l.ord[l.lo]]<lt-240)l.lo++;
        var m2=l.mask2.getContext('2d');m2.clearRect(0,0,l.W,l.H);m2.fillStyle='#000';dots(m2,l,l.lo,l.p);
        compose(l.gc,l,l.bright,l.mask2);
      }else if(l.p<l.N||!l.done){l.p=l.N;l.done=1;l.gc.clearRect(0,0,l.W,l.H);l.vc.clearRect(0,0,l.W,l.H);l.vc.drawImage(l.base,0,0);}
    });
    if(el<total)requestAnimationFrame(frame);
    else{lines.forEach(function(l){l.done=0;});
      fp.style.transition='stroke-dashoffset 1.6s ease-in-out';fp.style.strokeDashoffset=0;fb.classList.add('show');fa.classList.add('show');
      later(1200,id,function(){d1.classList.add('show');
        later(800,id,function(){d2.classList.add('show');
          later(900,id,function(){d3.classList.add('show');
            later(2200,id,function(){h.classList.add('show');});});});});}
  }
  requestAnimationFrame(frame);
}
document.body.addEventListener('click',play);
var started=false;function go(){if(!started){started=true;play();}}
if(document.fonts&&document.fonts.load){document.fonts.load('60px "Great Vibes"').then(go,go);setTimeout(go,3000);}else go();
})();
</script>
